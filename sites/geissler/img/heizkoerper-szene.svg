<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-label="Illustration: Heizkörper unter einem Fenster mit warmem Licht">
  <defs>
    <linearGradient id="raum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede2"/>
      <stop offset="1" stop-color="#e7dccb"/>
    </linearGradient>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset=".55" stop-color="#fca55d"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="boden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89b6b"/>
      <stop offset="1" stop-color="#b3835a"/>
    </linearGradient>
    <linearGradient id="hk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
    <linearGradient id="waerme" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wand & Boden -->
  <rect width="800" height="680" fill="url(#raum)"/>
  <rect y="560" width="800" height="120" fill="url(#boden)"/>
  <rect y="556" width="800" height="10" fill="#8a6644"/>
  <!-- Dielen -->
  <g stroke="#a1744e" stroke-width="2" opacity=".5">
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="640" x2="800" y2="640"/>
    <line x1="180" y1="566" x2="160" y2="680"/>
    <line x1="430" y1="566" x2="420" y2="680"/>
    <line x1="660" y1="566" x2="670" y2="680"/>
  </g>
  <!-- Sockelleiste -->
  <rect y="540" width="800" height="18" fill="#f8f4ec"/>

  <!-- Fenster -->
  <g>
    <rect x="170" y="60" width="460" height="330" rx="10" fill="#ffffff"/>
    <rect x="186" y="76" width="428" height="298" rx="6" fill="url(#himmel)"/>
    <!-- Sonne -->
    <circle cx="330" cy="230" r="46" fill="#fff3d6"/>
    <circle cx="330" cy="230" r="60" fill="#fff3d6" opacity=".35"/>
    <!-- Skyline -->
    <g fill="#d97a2b">
      <rect x="196" y="300" width="60" height="74"/>
      <rect x="268" y="322" width="44" height="52"/>
      <rect x="410" y="308" width="70" height="66"/>
      <rect x="494" y="330" width="40" height="44"/>
      <rect x="548" y="312" width="58" height="62"/>
    </g>
    <!-- Sprossen -->
    <rect x="392" y="76" width="14" height="298" fill="#ffffff"/>
    <rect x="186" y="216" width="428" height="12" fill="#ffffff"/>
    <!-- Fensterbank -->
    <rect x="152" y="390" width="496" height="20" rx="6" fill="#f8f4ec"/>
    <rect x="152" y="408" width="496" height="8" rx="4" fill="#d9cfbe"/>
  </g>

  <!-- Lichtkegel -->
  <path d="M200 100 L 620 100 L 760 680 L 60 680 Z" fill="#ffdf9e" opacity=".14"/>

  <!-- aufsteigende Wärme über dem Heizkörper -->
  <rect x="220" y="330" width="360" height="130" fill="url(#waerme)"/>
  <g stroke="#f97316" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300 430 q 10 -22 0 -44 q -10 -22 0 -44"/>
    <path d="M400 436 q 10 -22 0 -44 q -10 -22 0 -44"/>
    <path d="M500 430 q 10 -22 0 -44 q -10 -22 0 -44"/>
  </g>

  <!-- Heizkörper -->
  <g>
    <rect x="220" y="440" width="360" height="120" rx="12" fill="url(#hk)"/>
    <rect x="220" y="440" width="360" height="120" rx="12" fill="none" stroke="#b9c2ce" stroke-width="2"/>
    <!-- Glieder -->
    <g fill="#cfd7e0">
      <rect x="238" y="452" width="14" height="96" rx="7"/>
      <rect x="266" y="452" width="14" height="96" rx="7"/>
      <rect x="294" y="452" width="14" height="96" rx="7"/>
      <rect x="322" y="452" width="14" height="96" rx="7"/>
      <rect x="350" y="452" width="14" height="96" rx="7"/>
      <rect x="378" y="452" width="14" height="96" rx="7"/>
      <rect x="406" y="452" width="14" height="96" rx="7"/>
      <rect x="434" y="452" width="14" height="96" rx="7"/>
      <rect x="462" y="452" width="14" height="96" rx="7"/>
      <rect x="490" y="452" width="14" height="96" rx="7"/>
      <rect x="518" y="452" width="14" height="96" rx="7"/>
      <rect x="546" y="452" width="14" height="96" rx="7"/>
    </g>
    <!-- Füße & Anschluss -->
    <rect x="250" y="560" width="12" height="18" fill="#9aa6b4"/>
    <rect x="538" y="560" width="12" height="18" fill="#9aa6b4"/>
    <!-- Thermostatventil -->
    <rect x="196" y="470" width="28" height="16" rx="6" fill="#9aa6b4"/>
    <rect x="168" y="462" width="34" height="32" rx="8" fill="#ffffff" stroke="#b9c2ce" stroke-width="2"/>
    <rect x="176" y="470" width="18" height="4" rx="2" fill="#ea580c"/>
    <rect x="176" y="478" width="18" height="4" rx="2" fill="#c3ccd9"/>
  </g>

  <!-- Pflanze rechts -->
  <g>
    <path d="M672 560 l8-46 h56 l8 46 z" fill="#b35c37"/>
    <g fill="#2f6b4f">
      <path d="M706 514 C 692 470 668 456 646 452 c6 32 24 56 60 62z"/>
      <path d="M710 514 C 712 468 730 444 756 436 c4 36-14 66-46 78z"/>
      <path d="M708 514 C 702 484 704 462 716 442 c14 20 12 50-8 72z"/>
    </g>
  </g>
</svg>
