<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" role="img" aria-label="Illustration: modernes Thermostat an der Wand">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a45"/>
      <stop offset=".55" stop-color="#16233d"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#f97316" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#f97316" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3b5c"/>
      <stop offset="1" stop-color="#141f36"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b4f"/>
      <stop offset="1" stop-color="#1d4a36"/>
    </linearGradient>
  </defs>

  <!-- Wand -->
  <rect width="600" height="690" fill="url(#wall)"/>
  <rect width="600" height="690" fill="url(#glow)"/>
  <!-- feine Fugenlinien -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <line x1="0" y1="172" x2="600" y2="172"/>
    <line x1="0" y1="518" x2="600" y2="518"/>
    <line x1="150" y1="0" x2="150" y2="690"/>
    <line x1="450" y1="0" x2="450" y2="690"/>
  </g>

  <!-- Schatten des Thermostats -->
  <ellipse cx="308" cy="452" rx="150" ry="26" fill="#000" opacity=".28"/>

  <!-- Thermostat -->
  <g>
    <circle cx="300" cy="300" r="150" fill="url(#ring)"/>
    <circle cx="300" cy="300" r="150" fill="none" stroke="#0b1220" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="300" cy="300" r="118" fill="url(#face)"/>

    <!-- Skala -->
    <g stroke="#c3ccd9" stroke-width="3" stroke-linecap="round">
      <line x1="300" y1="196" x2="300" y2="208"/>
      <line x1="382" y1="230" x2="373" y2="238"/>
      <line x1="416" y1="300" x2="404" y2="300"/>
      <line x1="382" y1="370" x2="373" y2="362"/>
      <line x1="218" y1="230" x2="227" y2="238"/>
      <line x1="184" y1="300" x2="196" y2="300"/>
      <line x1="218" y1="370" x2="227" y2="362"/>
    </g>

    <!-- aktiver Bogen -->
    <path d="M 300 415 A 115 115 0 0 1 185 300" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" transform="rotate(135 300 300)"/>

    <!-- Anzeige -->
    <text x="300" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" fill="#16233d">21,5°</text>
    <!-- Flamme -->
    <path d="M300 322 c1.6 5-.9 9-4.3 12.6 -3.4 3.6-5.5 6.5-5.5 10.1 a9.8 9.8 0 0 0 19.6 .4 c0-3.3-1.4-6.2-3.3-8.9 .2 2.4-.6 4.5-2.7 5.5 .8-4.6-1-10.3-3.8-13.7z" fill="#ea580c" transform="translate(0,4)"/>
    <text x="300" y="386" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#94a3b8">HEIZEN</text>

    <!-- Glanz -->
    <path d="M195 235 A 128 128 0 0 1 405 235 A 150 150 0 0 0 195 235 Z" fill="#ffffff" opacity=".12"/>
  </g>

  <!-- Regal mit Pflanze unten -->
  <g>
    <rect x="70" y="560" width="200" height="14" rx="7" fill="#22314f"/>
    <rect x="70" y="574" width="200" height="6" rx="3" fill="#0b1220" opacity=".5"/>
    <!-- Topf -->
    <path d="M120 560 l6-38 h44 l6 38 z" fill="#c2643a"/>
    <path d="M120 560 l6-38 h44 l6 38 z" fill="#000" opacity=".12"/>
    <!-- Blätter -->
    <g fill="url(#leaf)">
      <path d="M148 524 C 138 490 118 478 100 474 c4 26 18 46 44 54z"/>
      <path d="M150 524 C 152 486 168 466 190 458 c2 30-12 56-36 68z"/>
      <path d="M149 524 C 145 500 146 482 156 466 c10 16 10 40-2 58z"/>
    </g>
  </g>

  <!-- kleines Kabel-Detail rechts -->
  <g stroke="#22314f" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M470 620 q 30 -18 24 -52"/>
  </g>
  <circle cx="470" cy="622" r="10" fill="#22314f"/>
</svg>
