name: Deploy A&F Automobile to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/save-images-7pko9c
    paths:
      - "sites/af-automobile/**"
      - ".github/workflows/pages-af-automobile.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (sites/af-automobile)
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/af-automobile

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
